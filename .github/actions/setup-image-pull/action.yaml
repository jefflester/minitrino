---
name: 'Setup Image Pull'
description: 'Handle conditional image pulling (PR-specific with retry, or latest from master)'
author: 'Minitrino'

inputs:
  github-token:
    description: 'GitHub token for GHCR authentication'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
  image-type:
    description: 'Image type (trino or starburst)'
    required: true
  cluster-version:
    description: 'Cluster version for tagging'
    required: true
  image-changed:
    description: 'Whether image was rebuilt in this PR (true/false)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Pull and tag image
      shell: bash
      run: |
        IMAGE_TYPE="${{ inputs.image-type }}"
        PR_NUMBER="${{ inputs.pr-number }}"
        CLUSTER_VERSION="${{ inputs.cluster-version }}"
        IMAGE_CHANGED="${{ inputs.image-changed }}"
        LOCAL_TAG="minitrino/cluster:${CLUSTER_VERSION}-${IMAGE_TYPE}"

        if [ "${IMAGE_CHANGED}" == "true" ]; then
          IMAGE="ghcr.io/jefflester/minitrino:pr-${PR_NUMBER}-${IMAGE_TYPE}"
          echo "Waiting for PR image ${IMAGE}..."
          for i in $(seq 1 120); do
            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "Image available after ${i} attempts"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Timeout waiting for image ${IMAGE}"
              exit 1
            fi
            sleep 30
          done
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" "${LOCAL_TAG}"
        else
          IMAGE="ghcr.io/jefflester/minitrino:latest-${IMAGE_TYPE}"
          echo "Pulling latest image ${IMAGE}..."
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" "${LOCAL_TAG}"
        fi

        echo "Image ready: ${LOCAL_TAG}"
