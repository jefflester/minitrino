version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    # The docs/api/ API reference is generated output (gitignored, not
    # committed). Regenerate it on every build so it never goes stale,
    # mirroring install/docs/docs-build.sh. Runs after the docs extras
    # (which provide sphinx-apidoc) are installed. RTD executes these entries
    # without a shell (no quote handling), so the logic lives in a script.
    pre_build:
      - bash install/docs/rtd-pre-build.sh

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
