---
name: Source Build Tests

on:
  pull_request:
    branches:
      - master
    paths:
      - src/**

jobs:
  source-build:
    name: CLI Integration Tests (Source Build)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Resolve versions from java-matrix.json
        id: versions
        run: |-
          ENTRY=$(python3 -c "
          import json
          matrix = json.load(open('src/lib/image/data/java-matrix.json'))
          latest = [e for e in matrix if e['max_trino'] is None][0]
          print(f\"trino={latest['min_trino']}\")
          print(f\"java={latest['java_major']}\")
          ")
          echo "$ENTRY" >> $GITHUB_OUTPUT

      - name: Free up disk space
        uses: ./.github/actions/cleanup-disk

      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.java }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: trino-maven-${{ steps.versions.outputs.trino }}-v1
          restore-keys: |
            trino-maven-${{ steps.versions.outputs.trino }}-
            trino-maven-

      - name: Clone Trino source
        run: |-
          git clone --depth 1 --branch "${{ steps.versions.outputs.trino }}" \
            https://github.com/trinodb/trino.git /tmp/trino-source

      - name: Build Trino server distribution
        working-directory: /tmp/trino-source
        timeout-minutes: 75
        run: |-
          ./mvnw install \
            -pl core/trino-server -am \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Dair.check.skip-all=true \
            -T1C \
            -q

      - name: Verify build output
        run: |-
          DIST_DIR=$(find /tmp/trino-source/core/trino-server/target \
            -maxdepth 1 -type d -name 'trino-server-*' \
            ! -name '*-hardlinks' | head -1)
          echo "Distribution directory: ${DIST_DIR}"
          ls -la "${DIST_DIR}/"
          test -d "${DIST_DIR}/bin"
          test -d "${DIST_DIR}/lib"
          test -d "${DIST_DIR}/plugin"

      - name: Run source build integration tests
        env:
          IS_GITHUB: ${{ vars.IS_GITHUB }}
          MINITRINO_TEST_LOG_LEVEL: DEBUG
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRINO_SOURCE_PATH: /tmp/trino-source
        run: |-
          minitrino --help || exit 1
          pytest -x --debug \
            --cov=minitrino \
            --cov-report=term-missing \
            --cov-report=xml \
            src/tests/cli/integration_tests/test_source_build.py
